name: Objavi sajt na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4
      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instaliraj zavisnosti
        run: npm ci
      - name: Napravi produkcioni sajt
        run: npm run build
      - name: Podesi GitHub Pages
        uses: actions/configure-pages@v5
      - name: Pripremi statičke fajlove
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Objavi sajt
        id: deployment
        uses: actions/deploy-pages@v4